<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Araxxor Fight Lab</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1010;--panel:#171c1b;--line:#2b3531;--ink:#e9efe9;--muted:#92a099;--lime:#a8e05f;--acid:#d5ff42;--danger:#ff6e63;--gold:#e9b85e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#243029 0,transparent 35%),var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}.shell{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}h1{font-size:30px;margin:0;letter-spacing:-1px}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:2px;font-size:11px}.status{color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);margin-right:7px}.cards{display:grid;grid-template-columns:repeat(8,minmax(110px,1fr));gap:10px}.card,.panel{background:color-mix(in srgb,var(--panel) 93%,transparent);border:1px solid var(--line);border-radius:10px}.card{padding:14px}.card b{display:block;font:700 25px/1.1 ui-monospace,monospace;margin-top:6px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.panel{padding:16px;min-width:0}.panel h2{font-size:14px;margin:0 0 12px}.snapshot{font:12px/1.6 ui-monospace,monospace;color:#bfd1c5;word-break:break-word;background:#0d1110;padding:12px;border-radius:6px;min-height:64px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid #222a27;vertical-align:top}.tick{font-family:ui-monospace,monospace;color:var(--gold)}.tag{font:700 10px ui-monospace,monospace;color:var(--lime)}.detail{font-family:ui-monospace,monospace;color:#b7c2bc;word-break:break-word}.scroll{max-height:590px;overflow:auto}.empty{color:var(--muted);padding:28px 5px}.danger{color:var(--danger)}@media(max-width:1050px){.cards{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">Local combat telemetry</div><h1>Araxxor Fight Lab</h1></div><div class="status"><span class="dot"></span><span id="connection">Connecting</span></div></header>
<section class="cards" id="cards"></section><section class="grid"><div class="panel"><h2>Fight event stream</h2><div class="scroll"><table><thead><tr><th>Tick</th><th>Event</th><th>Detail</th></tr></thead><tbody id="events"></tbody></table><div class="empty" id="empty">Waiting for Araxxor events…</div></div></div><aside><div class="panel"><h2>Latest state snapshot</h2><div class="snapshot" id="snapshot">Waiting for telemetry…</div></div><div class="panel" style="margin-top:14px"><h2>Mechanic timing</h2><div class="scroll" style="max-height:380px"><table><thead><tr><th>Tick</th><th>Signal</th><th>Detail</th></tr></thead><tbody id="mechanics"></tbody></table></div></div></aside></section></main>
<script>
const cards=[['seconds','Kill time','s'],['damage','Damage',''],['food','Food used',''],['moves','Moves',''],['attacks','Attacks',''],['acidTicks','Acid ticks',''],['prayerMisses','Prayer misses',''],['attackReadyMovement','DPS-lost ticks','']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function row(e){return `<tr><td class="tick">${e.tick}</td><td><span class="tag">${esc(e.type)}</span></td><td class="detail">${esc(e.detail)}</td></tr>`}
async function refresh(){try{const r=await fetch('/api/data',{cache:'no-store'}),d=await r.json();document.querySelector('.dot').style.background=d.available?'var(--lime)':'var(--danger)';document.getElementById('connection').textContent=d.available?'Live · '+new Date(d.updatedAt).toLocaleTimeString():d.message;const m=d.metrics||{};document.getElementById('cards').innerHTML=cards.map(([k,l,u])=>`<div class="card"><span class="label">${l}</span><b>${m[k]??'—'}${m[k]!=null?u:''}</b></div>`).join('');document.getElementById('snapshot').textContent=d.snapshot||'Waiting for telemetry…';const ev=d.events||[];document.getElementById('events').innerHTML=ev.map(row).join('');document.getElementById('empty').style.display=ev.length?'none':'block';const mech=ev.filter(e=>/CLEAVE|ACID|DAMAGE|PRAYER|FOOD|MOVE/.test(e.type)).slice(0,80);document.getElementById('mechanics').innerHTML=mech.map(row).join('')}catch(e){document.getElementById('connection').textContent='Dashboard server unavailable';document.querySelector('.dot').style.background='var(--danger)'}}
refresh();setInterval(refresh,750);
</script></body></html>
